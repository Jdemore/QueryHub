<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; font-src 'self'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>QueryHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 id="site-title">QueryHub</h1>
        <p id="tagline"></p>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Search title, description, query text, tags (press / to focus)"
               aria-label="Search queries" autocomplete="off">
      </div>
      <div class="header-actions">
        <button id="add-btn" type="button" class="btn btn-primary">Add query</button>
        <button id="account-btn" type="button" class="btn">Sign in</button>
        <button id="theme-toggle" type="button" class="btn" aria-label="Toggle light or dark theme">Theme</button>
      </div>
    </div>
    <div class="filters">
      <div id="status-filter" class="chips" role="group" aria-label="Filter by status"></div>
      <span id="sync-status" class="sync" aria-live="polite"></span>
      <span id="result-count" class="count"></span>
    </div>
  </header>

  <main class="content">
    <p id="app-error" class="error" hidden></p>
    <section id="query-list" aria-live="polite"></section>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form" class="dialog-body">
      <h2 id="editor-title">Add query</h2>
      <input type="hidden" id="f-id">
      <div class="field">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" required maxlength="200" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status"></select>
        </div>
        <div class="field">
          <label for="f-tags">Tags</label>
          <input id="f-tags" type="text" placeholder="comma, separated, tags" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label for="f-description">Description</label>
        <textarea id="f-description" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="f-query">Query (KQL)</label>
        <textarea id="f-query" class="code" rows="10" required spellcheck="false"></textarea>
        <ul id="editor-lint" class="lint-list" aria-live="polite"></ul>
      </div>
      <div class="field">
        <label for="f-sample">Sample results</label>
        <textarea id="f-sample" class="code" rows="5" spellcheck="false"></textarea>
        <p class="hint">Tab-separated, first line is the column header. Copying rows from the Log Analytics results grid and pasting here works.</p>
      </div>
      <div class="dialog-actions">
        <button id="editor-cancel" type="button" class="btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="account" aria-labelledby="account-title">
    <div class="dialog-body">
      <h2 id="account-title">Account</h2>

      <div id="account-tabs" class="tabs" role="tablist">
        <button id="tab-signin" type="button" class="tab active" role="tab" aria-selected="true">Sign in</button>
        <button id="tab-signup" type="button" class="tab" role="tab" aria-selected="false">Sign up</button>
      </div>

      <form id="signin-form" class="stack">
        <div class="field">
          <label for="f-username">Username</label>
          <input id="f-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="f-pin">PIN</label>
          <input id="f-pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        </div>
        <p id="signin-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button id="signin-cancel" type="button" class="btn">Cancel</button>
          <button id="signin-submit" type="submit" class="btn btn-primary">Sign in</button>
        </div>
      </form>

      <form id="signup-form" class="stack" hidden>
        <p class="hint">You need the invite code from the site owner. Pick a username (letters, numbers, underscore) and a 6-digit PIN. No email required.</p>
        <div class="field">
          <label for="f-new-username">Username</label>
          <input id="f-new-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
                 pattern="[A-Za-z0-9_]{3,20}" title="3-20 characters: letters, numbers, underscore" required>
        </div>
        <div class="field">
          <label for="f-new-pin">6-digit PIN</label>
          <input id="f-new-pin" type="password" inputmode="numeric" autocomplete="new-password"
                 pattern="[0-9]{6}" title="Exactly 6 digits" required>
        </div>
        <div class="field">
          <label for="f-invite">Invite code</label>
          <input id="f-invite" type="password" autocomplete="off" required>
        </div>
        <p id="signup-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button id="signup-cancel" type="button" class="btn">Cancel</button>
          <button id="signup-submit" type="submit" class="btn btn-primary">Create account</button>
        </div>
      </form>

      <div id="signedin-panel" class="stack" hidden>
        <p id="signedin-user" class="hint"></p>
        <div class="dialog-actions">
          <button id="signedin-signout" type="button" class="btn btn-danger">Sign out</button>
          <button id="signedin-close" type="button" class="btn">Close</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
